# 宝石示例文件
# 仅供参考

# id
gem_id_1:
  # 名称(不建议重复)
  name: "名称"
  # 宝石类型
  type: UTILITY
  # 宝石等级
  level: 1
  # 宝石物品材质
  material: BONE
  # 属性 lore
  attributes:
    - "&e物品掉落率 +5%"
    - "&e经验加成 +4%"
  # (可选)  
  socket:
    # (可选) 成功率, 默认 1
    success_rate: 0.95
    # (可选) 失败时损坏宝石, 默认 false
    destroy_on_failure: false
    # (可选) 装备材质过滤, 不配置时不限制
    # mode 可选 NONE, WHITELIST, BLACKLIST
    equipment_materials:
       mode: WHITELIST
       list: [ALL_SWORD, MACE]
  # (可选) 掉落配置, 配置对应的掉落来源
  drop:
    # (可选) 配置时代表启用, 覆盖 drop_source.yml 下的设置
    #
    # 原版怪物掉落设置
    normal:
      # (可选) enable: false 没啥意义啊, 不如不配置
      # (可选) 概率
      chance: 0.02
      # (可选) 指定实体掉落
      allow_entities:
        - "ZOMBIE"
    mythic:
      chance: 0.02
      min_mob_level: 1
      per_level_rate: 0.001
gem_id_2:
  name: "名称2"
  type: UTILITY
  level: 1
  material: BONE
  attributes:
    - "物品掉落率 +5%"
    - "经验加成 +4%"

gem_id_3:
  name: "名称3"
  type: UTILITY
  level: 1
  material: BONE
  attributes:
    - "经验加成 +4%"
  # (可选)
  overrides:
    # 宝石 displayName 与 lore 显示模板
    # 可用变量: 
    #  {gemTypeColor} 宝石类型颜色  {gemName} 宝石名称  {gemLevelStars} 宝石等级星星表示(★)  {gemLevel} 宝石等级数字表示(1)
    #  {gemTypeName} 宝石类型名称   {successRate} 镶嵌成功率(99%)  {destroyOnFailure} 失败是否破坏(是/否)  {gemId} 宝石id
    # 可选
    display_pattern:
      # (可选)
      display_name: "测试宝石3"
      # (可选)
      # 专有变量:
      #  {attributeLores} 属性 lore(只在一行中单独存在该变量时解析)
      lore:
        - "&7不过1个普普通通的小宝石罢了"
        - ""
        - "&e可提供增幅:"
        - "{attributeLores}"
        - ""
        - "&e右键点击装备可直接镶嵌"
        - "&e或使用 /gem socket 打开镶嵌界面"
      # 每一行属性 lore 的显示模板
      # {attributeLore} 当行对应的属性 lore, 在宝石配置文件中, 该变量仅对当前配置有效
      # (可选)
      per_line_attribute_lore: "&7  - &b{attributeLore}"
    # (可选) 宝石物品本身的属性
    item:
      # 物品耐久
      # 格式-1: 20    原版耐久, "20" 相当于 "该物品耐久只剩(该材质最大耐久-20)"
      # 格式-2: <20   反算耐久, "<20" 效果是 "该物品耐久只剩20"
      # 格式-3: 20%   百分比耐久, 与耐久条相同
      # (可选)
      Durability: "20"
      #
      # 附魔列表
      # 格式:
      # - "附魔名称:等级"
      # (可选)
      EnchantList:
        - "SHARPNESS:5"
      # 隐藏选项
      # 格式:
      # - "HIDE_ENCHANTS"
      # - "HIDE_ATTRIBUTES"
      # - "HIDE_UNBREAKABLE"
      # - "HIDE_ADDITIONAL_TOOLTIP"
      # 参考: https://jd.papermc.io/paper/1.21.11/org/bukkit/inventory/ItemFlag.html
      # (可选)
      ItemFlagList:
        - "HIDE_ENCHANTS"
      # 物品染色
      # (可选)
      Color: "FF0000"
      # 物品属性
      # 格式:
      # - "属性名:数字:模式:生效位置"    # 生效当前位置
      # - "属性名:数字:模式"           # 生效所有位置
      # 模式:
      #   0   ADD_NUMBER          属性增量
      #   1   ADD_SCALAR          倍率增量
      #   2   MULTIPLY_SCALAR_1   最终倍乘
      # 生效位置: 不填写生效位置则生效在所有部位上
      #   HAND      主手
      #   OFF_HAND  副手
      #   HEAD      头
      #   CHEST     身
      #   LEGS      腿
      #   FEET      脚
      # 参考WIKI: https://minecraft.fandom.com/zh/wiki/%E5%B1%9E%E6%80%A7
      # 参考: https://jd.papermc.io/paper/1.21.11/org/bukkit/attribute/Attribute.html
      # (可选)
      Attributes:
        - "ATTACK_DAMAGE:10:0:HAND"
      #自定义材质ID CustomModelData: 1000
      # (可选)
      CustomModelData: 1000
      # 药水系统
      # 说明: ambient, particles, icon 默认值为 true
      # 默认和自定义二选一
      # 格式-1: 默认药水参数
      #   Potion: JUMP_BOOST
      # 格式-2: 自定义药水
      #   Potion:
      #     JUMP_BOOST:
      #       duration: 20
      #       amplifier: 1
      #       ambient: true
      #       particles: true
      #       icon: true
      # 参考: https://jd.papermc.io/paper/1.21.11/org/bukkit/potion/PotionEffectType.html
      # (可选)
      Potion:
        JUMP_BOOST:
          duration: 20
          amplifier: 1
          # (可选)
          ambient: true
          # (可选)
          particles: true
          # (可选)
          icon: true

gem_id_4:
  name: "Name 4"
  type: UTILITY
  level: 1
