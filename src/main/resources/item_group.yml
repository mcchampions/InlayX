# 物品组
# 可以引用其他物品组
# 注意: 不要相互引用
# 自带物品组可能在其他版本上会导致问题
# 在 1.21.11 上经过测试, 其他版本酌情修改
item_group:
  # 此时 {equipmentId} 指代 ALL_SWORD
  ALL_SWORD:
    # {equipmentName} 变为指定 name(所有剑)
    name: "所有剑"
    # 物品列表
    items:
      - "WOODEN_SWORD"
      - "STONE_SWORD"
      - "IRON_SWORD"
      - "GOLDEN_SWORD"
      - "DIAMOND_SWORD"
      - "NETHERITE_SWORD"
      - "COPPER_SWORD"

  ALL_AXE:
    name: "所有斧头"
    items:
      - "WOODEN_AXE"
      - "STONE_AXE"
      - "IRON_AXE"
      - "GOLDEN_AXE"
      - "DIAMOND_AXE"
      - "NETHERITE_AXE"
      - "COPPER_AXE"

  ALL_SPEAR:
    name: "所有矛"
    items:
      - "WOODEN_SPEAR"
      - "STONE_SPEAR"
      - "IRON_SPEAR"
      - "GOLDEN_SPEAR"
      - "DIAMOND_SPEAR"
      - "NETHERITE_SPEAR"
      - "COPPER_SPEAR"

  ALL_WEAPONS:
    name: "所有武器"
