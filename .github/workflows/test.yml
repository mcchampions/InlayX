name: Test
on:
  push:
    branches: [ "main" ]
    paths:
      - 'pom.xml'
      - '.editorconfig'
      - 'src/**'
      - '.github/**'
  workflow_dispatch:

env:
  TZ: 'Asia/Shanghai'

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      unique_filename: ${{ steps.get_name.outputs.unique_filename }}
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          java-package: jdk
          architecture: x64
          cache: maven
      - name: Maven Test
        run: mvn test
      - name: Maven Build Test
        run: mvn clean package -DskipTests=true
      - name: Delete useless files
        run: |
          rm -rf target/classes target/generated-sources target/generated-test-sources
          rm -rf target/maven-archiver target/maven-status target/test-classes target/javadoc-bundle-options
          rm target/original-*.jar
          rm target/spotless-index
      - name: Get file name
        id: get_name
        run: |
            FILE_NAME=$(find ./target -maxdepth 1 -type f | head -n 1 | xargs basename)
            
            if [ -z "$FILE_NAME" ]; then
              echo "Error: No files found in the ./target directory."
              exit 1
            fi
            
            echo "unique_filename=$FILE_NAME" >> $GITHUB_OUTPUT
          
            echo "Find：$FILE_NAME"
      - name: Upload E2E plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: inlayx-e2e-jar
          path: target
          if-no-files-found: error

  e2e:
    needs: test
    uses: ./.github/workflows/e2e-testing.yml
    with:
      artifact-name: inlayx-e2e-jar
      jar-path: artifact/${{ needs.test.outputs.unique_filename }}
