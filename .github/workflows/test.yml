name: Test
on:
  push:
    branches: [ "main" ]
    paths:
      - 'pom.xml'
      - '.editorconfig'
      - 'src/**'
      - '.github/**'
  workflow_dispatch:

env:
  TZ: 'Asia/Shanghai'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          java-package: jdk
          architecture: x64
          cache: maven
      - name: Test
        run: mvn test