name: Test
on:
  push:
    branches: [ "main" ]
    paths:
      - 'pom.xml'
      - '.editorconfig'
      - 'src/**'
      - '.github/**'
  workflow_dispatch:

env:
  TZ: 'Asia/Shanghai'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          java-package: jdk
          architecture: x64
          cache: maven
      - name: Maven Test
        run: mvn test
      - name: Maven Build Test
        run: mvn clean package -DskipTests=true
      - name: Upload E2E plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: inlayx-e2e-jar
          path: target/InlayX-1.0-SNAPSHOT.jar
          if-no-files-found: error

  e2e:
    needs: test
    uses: ./.github/workflows/e2e-testing.yml
    with:
      artifact-name: inlayx-e2e-jar
      jar-path: artifact/InlayX-1.0-SNAPSHOT.jar
