name: Auto Builder
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  TZ: 'Asia/Shanghai'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          java-package: jdk
          architecture: x64
          cache: maven
      - name: Build with Maven
        run: mvn clean package -DskipTests=true
      - name: Delete useless files
        run: |
          rm -rf target/classes target/generated-sources target/generated-test-sources
          rm -rf target/maven-archiver target/maven-status target/test-classes
          rm target/original-*.jar
          rm target/spotless-index
      - uses: actions/upload-artifact@v7
        name: Upload artifact
        with:
          name: InlayX Build
          path: target
